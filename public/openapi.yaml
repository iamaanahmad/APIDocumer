openapi: 3.0.3
info:
  title: Free Fire Community API - Free Fire Player Stats & Data API
  version: '2.0'
  description: |
    # Free Fire Community API Documentation
    
    ## 🎮 The Most Comprehensive Free Fire API
    
    Welcome to the **Free Fire Community API** - a comprehensive, API service that provides access to Free Fire player statistics, craftland maps, wishlist data, and game assets.
    
    ### 🌟 Key Features
    - ✅ **Real-time Player Statistics** - Access live player data and rankings
    - ✅ **Comprehensive Profile Data** - Get detailed player information
    - ✅ **Craftland Maps** - Fetch custom map information
    - ✅ **Game Assets** - Access in-game images and icons
    - ✅ **Ban Status Checking** - Verify player ban status
    - ✅ **Multi-Region Support** - SG, IND, BR regions
    - ✅ **Fast & Reliable** - Optimized for performance
    
    ## 🔑 Getting Your API Key
    
    To use this API, you'll need an API key. Get yours at:
    **[Free Fire Community Developer Platform](https://developers.freefirecommunity.com/)**
    
    ### Authentication Methods
    
    You can authenticate your API requests using either method:
    
    1. **Header Authentication (Recommended)**
       ```
       x-api-key: your_api_key_here
       ```
       More secure as the key is not visible in URLs or logs.
    
    2. **Query Parameter Authentication**
       ```
       ?key=your_api_key_here
       ```
       Simpler for testing but less secure. Use header method in production.
    
    ## 🌍 Regional Support
    
    Our API supports all Free Fire regions with three main endpoints:
    
    - **SG Region**: Covers `SG`, `ID`, `ME`, `VN`, `TH`, `CIS`, `EU`, `TW`, `MY`, `PK`, `BD`
    - **IND Region**: Covers India only
    - **BR Region**: Covers `BR`, `US`, `NA`, `LATAM`
    
    ## 🚀 Rate Limits
    
    Rate limits vary by plan:
    - **Trial**: Playground only — no API key, no production usage
    - **Trial Pass**: 500 total requests (one-time), 20 requests/minute, 100 requests/hour
    - **Beginner**: 5,000 requests/month, 30 requests/minute, 500 requests/hour
    - **Developer**: 15,000 requests/month, 60 requests/minute, 2,000 requests/hour
    - **Pro**: 50,000 requests/month, 120 requests/minute, 6,000 requests/hour
    - **Enterprise**: 100,000+ requests/month, custom rate limits
    
    Top-up credits and upgrade carry-over credits are added on top of your monthly quota.
    
    ### Quota cost per request
    
    Most endpoints consume **1 unit** of monthly quota per request. The `/stats` endpoint
    consumes **2 units**. The cost is returned in the `X-Quota-Cost` response header.
    Per-minute and per-hour burst limits always count each request as 1.
    
    ### Per-IP abuse guard
    
    In addition to plan limits, requests are counted per IP address over a 5-minute window.
    Free/trial plans allow 30 requests per window; paid plans allow at least
    `max(30, per-minute limit × 5)`. Exceeding it returns `429` with `code: RATE_001` and
    `type: ip-based`.
    
    ### Response headers
    
    Successful responses include `X-RateLimit-Limit/Remaining/Reset` (per-minute window),
    `X-RateLimit-Hour-Limit/Remaining/Reset` (per-hour window), `X-Quota-Cost`,
    `X-Response-Time`, `X-API-Version`, and `X-Cache` (`HIT` or `MISS`).
    
    ## 🗄️ Caching
    
    Upstream data is cached server-side. Cached responses return `X-Cache: HIT` and
    `X-Cache-TTL`, and still count against your quota and rate limits.
    
    - `/info`, `/stats`, `/guild`: 5 minutes
    - `/bancheck`, `/wishlist`: 10 minutes
    - `/craftland`: 15 minutes
    - `/image`: 1 hour
    
    ## 🛡️ Firewall & Required User-Agent Header
    
    Every request passes through an edge firewall **before** authentication. Server-side
    integrations and bots must send a custom `User-Agent` header or they are blocked with a
    `403` (or `429`) and an `FW_00x` code — before the API key is even checked.
    
    **Rules:**
    - Send a `User-Agent` header of at least 10 characters.
    - It must **not** contain HTTP library or automation names anywhere in the string
      (e.g. `curl`, `python`, `requests`, `axios`, `node-fetch`, `Go-http-client`, `okhttp`,
      `java`, `wget`, `bot`, `scrapy`, `puppeteer`, `playwright`, `selenium`, `postman`,
      `insomnia`, `httpie`). Matching is case-insensitive and substring-based, so `bot`
      matches even inside a URL such as `github.com/user/my-bot`.
    - Default User-Agents from `fetch`/undici, Python `requests`, Go `net/http`, and `curl`
      are blocked. Override the header explicitly.
    - Recommended format: `AppName/1.0 (+https://your-site-or-repo)`.
    
    **Firewall codes:**
    - `FW_001` (403): `User-Agent` missing or shorter than 10 characters.
    - `FW_002` (403): `User-Agent` matches a blocked library/bot pattern.
    - `FW_003` (403): `User-Agent` reports a very old browser version.
    - `FW_004` (429): too many requests from one IP (edge rate limit); honor `Retry-After`.
    
    A `403` with an `FW_` code is a firewall/User-Agent problem, not an API-key, plan, or
    region issue. The `region` parameter never affects the firewall or authorization.
    
    ## ⚠️ Important Disclaimer
    
    **This API and the Free Fire Community platform are NOT affiliated with, endorsed by, or connected to Garena International or Free Fire in any way.** This is an independent, community-driven project created by fans for fans. All trademarks, game content, and assets belong to their respective owners.
    
    ## Support & Community
    
    - **Developer Portal**: [developers.freefirecommunity.com](https://developers.freefirecommunity.com/)
    - **Documentation**: [docs.freefirecommunity.com](https://docs.freefirecommunity.com/)
    - **API Status**: [status.freefirecommunity.com](https://stats.uptimerobot.com/pB5twu5M3x/801663024)
    
    ## 🔒 Security & Privacy
    
    - All API requests should be made server-side to protect your API key
    - Never expose your API key in client-side code
    - We do not store or share personal player data
    - All data is sourced from publicly available information
    
    ---
    
    **Made with ❤️ by the Free Fire Community**
    
  contact:
    name: Free Fire Community API Support
    url: https://developers.freefirecommunity.com/contact
    email: support@freefirecommunity.com
  license:
    name: API License Agreement
    url: https://developers.freefirecommunity.com/terms
  termsOfService: https://developers.freefirecommunity.com/terms
  x-logo:
    url: https://developers.freefirecommunity.com/logo.png
    altText: Free Fire Community API
  x-api-id: free-fire-community-api
  x-keywords:
    - free fire api
    - free fire stats
    - free fire player data
    - garena free fire api
    - free fire statistics
    - free fire developer api
    - free fire rest api
    - free fire player stats
    - free fire game data

servers:
  - url: https://developers.freefirecommunity.com/api/v1
    description: Production API Server (Version 1)

tags:
  - name: Player Information
    description: Retrieve comprehensive player profile data, rankings, and account information
  - name: Player Statistics
    description: Access detailed gameplay statistics including kills, wins, and performance metrics
  - name: Craftland Maps
    description: Fetch information about custom Craftland maps and user-generated content
  - name: Player Wishlist
    description: View player wishlist items and desired in-game content
  - name: Player Ban Check
    description: Check if a player account is banned or has active ban periods
  - name: Game Assets
    description: Access in-game images, icons, and visual assets
  - name: Guild Information
    description: Retrieve guild (clan) details by guild ID

paths:
  /info:
    get:
      tags:
        - Player Information
      summary: Get Player Information
      description: |
        Retrieves comprehensive player information including profile data, rankings, badges, clan membership, pet information, and more.

        This endpoint provides detailed account information such as:
        - Basic account details (nickname, level, rank, likes)
        - Badge and banner information
        - Clan/guild membership details
        - Pet information and skills
        - Equipped items and skins
        - Credit score and diamond cost
        - Season statistics

        **Note**: Make sure to use the correct region code that matches the player's account region.
      operationId: getPlayerInfo
      parameters:
        - $ref: '#/components/parameters/RegionParam'
        - $ref: '#/components/parameters/UIDParam'
        - $ref: '#/components/parameters/ApiKeyHeader'
        - $ref: '#/components/parameters/ApiKeyQuery'
      responses:
        '200':
          description: Successfully retrieved player information
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerInfoResponse'
              example:
                basicInfo:
                  accountId: '665951869'
                  nickname: FFC•ASHQKING
                  level: 61
                  rank: 306
                  liked: 4902
                  region: IND
                captainBasicInfo:
                  accountId: '973498167'
                  nickname: Captain
                  level: 72
                  rank: 326
                  liked: 18320
                  region: IND
                clanBasicInfo:
                  clanName: ƝEOƝ»Ᏻᴀɴɢ×͜×
                  memberNum: 49
                  clanLevel: 5
                  capacity: 50
                creditScoreInfo:
                  creditScore: 100
                  rewardState: 1
                diamondCostRes:
                  diamondCost: 390
                petInfo:
                  id: '1300000119'
                  level: 5
                profileInfo:
                  avatarId: '101000007'
                socialInfo:
                  accountId: '665951869'
                  signature: I love free fire
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      x-code-samples:
        - lang: 'cURL (Header Auth - Recommended)'
          source: |
            curl -X GET "https://developers.freefirecommunity.com/api/v1/info?region=ind&uid=665951869" \
              -H "x-api-key: your_api_key_here"
        
        - lang: 'cURL (Query Parameter Auth)'
          source: |
            curl -X GET "https://developers.freefirecommunity.com/api/v1/info?region=ind&uid=665951869&key=your_api_key_here"
        
        - lang: 'JavaScript (Header Auth)'
          source: |
            const response = await fetch(
              'https://developers.freefirecommunity.com/api/v1/info?region=ind&uid=665951869',
              {
                headers: {
                  'x-api-key': 'your_api_key_here'
                }
              }
            );
            const data = await response.json();
        
        - lang: 'JavaScript (Query Parameter Auth)'
          source: |
            const response = await fetch(
              'https://developers.freefirecommunity.com/api/v1/info?region=ind&uid=665951869&key=your_api_key_here'
            );
            const data = await response.json();
        
        - lang: 'Python (Header Auth)'
          source: |
            import requests
            
            headers = {'x-api-key': 'your_api_key_here'}
            params = {'region': 'ind', 'uid': '665951869'}
            
            response = requests.get(
                'https://developers.freefirecommunity.com/api/v1/info',
                headers=headers,
                params=params
            )
            data = response.json()
        
        - lang: 'Python (Query Parameter Auth)'
          source: |
            import requests
            
            params = {
                'region': 'ind',
                'uid': '665951869',
                'key': 'your_api_key_here'
            }
            
            response = requests.get(
                'https://developers.freefirecommunity.com/api/v1/info',
                params=params
            )
            data = response.json()

  /stats:
    get:
      tags:
        - Player Statistics
      summary: Get Player Statistics
      description: |
        Retrieves detailed career gameplay statistics for a player across different Battle Royale game modes (Solo, Duo, Squad).
        
        This endpoint provides comprehensive career stats including:
        - Total games played, wins, and eliminations
        - Highest eliminations in a single match
        - Headshot statistics
        - Vehicle eliminations
        - Knockdowns and revives (for duo/squad modes)
        - Top placement counts (top 3, top 5, top 10)
        
        Statistics represent the player's all-time career performance in each mode.

        **Quota cost**: each request to this endpoint consumes **2 units** of monthly quota
        (reported in the `X-Quota-Cost` header). Burst limits still count it as 1.

        **Region**: optional, defaults to `ind` when omitted.
      operationId: getPlayerStats
      parameters:
        - $ref: '#/components/parameters/RegionParam'
        - $ref: '#/components/parameters/UIDParam'
        - $ref: '#/components/parameters/ApiKeyHeader'
        - $ref: '#/components/parameters/ApiKeyQuery'
      responses:
        '200':
          description: Successfully retrieved player statistics
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-Quota-Cost:
              $ref: '#/components/headers/X-Quota-Cost'
            X-Cache:
              $ref: '#/components/headers/X-Cache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerStatsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /guild:
    get:
      tags:
        - Guild Information
      summary: Get Guild Information
      description: |
        Retrieves guild (clan) information. Query parameters other than the API key are
        forwarded to the data provider.

        **Region**: optional, defaults to `br` when omitted.
      operationId: getGuildInfo
      parameters:
        - name: region
          in: query
          required: false
          schema:
            type: string
            enum: [sg, ind, br]
            default: br
          description: Region code of the guild
        - $ref: '#/components/parameters/ApiKeyHeader'
        - $ref: '#/components/parameters/ApiKeyQuery'
      responses:
        '200':
          description: Guild information successfully retrieved
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-Cache:
              $ref: '#/components/headers/X-Cache'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /image:
    get:
      tags:
        - Game Assets
      summary: Get Game Assets and Images
      description: |
        Retrieves in-game images and icons from the Free Fire asset database.
        
        This endpoint allows you to fetch various game assets including:
        - Character avatars and skins
        - Weapon skins and icons
        - Items and equipment icons
        - Badges and banners
        - Pet images
        - And more
      operationId: getGameImages
      parameters:
        - name: itemID
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d+$'
          description: The item ID to retrieve the image for
          example: '908028011'
        - $ref: '#/components/parameters/ApiKeyHeader'
        - $ref: '#/components/parameters/ApiKeyQuery'
      responses:
        '200':
          description: Image successfully retrieved
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Image not found
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /craftland:
    get:
      tags:
        - Craftland Maps
      summary: Get Craftland Map Information
      description: |
        Retrieves detailed information about a specific Craftland custom map.
      operationId: getCraftlandMapInfo
      parameters:
        - $ref: '#/components/parameters/RegionParam'
        - name: code
          in: query
          required: true
          schema:
            type: string
          description: The Craftland map code
          example: 'FREEFIRE625B83664022B40F67CBFBFF9CC3C1247490'
        - $ref: '#/components/parameters/ApiKeyHeader'
        - $ref: '#/components/parameters/ApiKeyQuery'
      responses:
        '200':
          description: Map information successfully retrieved
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CraftlandMapResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Map not found
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /wishlist:
    get:
      tags:
        - Player Wishlist
      summary: Get Player Wishlist
      description: |
        Retrieves the wishlist items for a specific player account.
      operationId: getPlayerWishlist
      parameters:
        - $ref: '#/components/parameters/RegionParam'
        - $ref: '#/components/parameters/UIDParam'
        - $ref: '#/components/parameters/ApiKeyHeader'
        - $ref: '#/components/parameters/ApiKeyQuery'
      responses:
        '200':
          description: Wishlist successfully retrieved
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishlistResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Player not found or wishlist is empty
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /bancheck:
    get:
      tags:
        - Player Ban Check
      summary: Check Player Ban Status
      description: |
        Checks if a Free Fire player account is currently banned or has an active ban period.

        **Note**: the upstream check is currently always performed with `lang=en`, so the
        `lang` parameter does not change the response language yet.
      operationId: checkPlayerBanStatus
      parameters:
        - $ref: '#/components/parameters/UIDParam'
        - name: lang
          in: query
          required: false
          schema:
            type: string
            enum: [en, ar, es, id, pt, ru, vi]
            default: en
          description: Language for the response
          example: en
        - $ref: '#/components/parameters/ApiKeyHeader'
        - $ref: '#/components/parameters/ApiKeyQuery'
      responses:
        '200':
          description: Ban check completed successfully
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BanCheckResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: |
        API key for authentication. Get your API key from the [Developer Platform](https://developers.freefirecommunity.com/).
        
        **Authentication Methods:**
        - **Header (Recommended)**: `x-api-key: your_api_key_here`
        - **Query Parameter**: `?key=your_api_key_here`
        
        **Security Best Practices:**
        - Header authentication is preferred for security
        - Never expose your API key in client-side code
        - Always make API requests from your server
        - Rotate your API key if compromised

  parameters:
    RegionParam:
      name: region
      in: query
      required: false
      schema:
        type: string
        enum: [sg, ind, br]
      description: |
        The region code for the player's account. Recommended on every request. When omitted,
        `/stats` and `/wishlist` default to `ind`, `/craftland` defaults to `sg`, and `/guild`
        defaults to `br`; `/info` forwards it to the data provider as-is.

        Region codes:
        - `sg`: Singapore region (covers SG, ID, ME, VN, TH, CIS, EU, TW, MY, PK, BD)
        - `ind`: India region (covers IND only)
        - `br`: Brazil region (covers BR, US, NA, LATAM)
      example: ind
    
    UIDParam:
      name: uid
      in: query
      required: true
      schema:
        type: string
        pattern: '^\d{5,15}$'
      description: The unique player User ID (5-15 digits)
      example: '665951869'
    
    ApiKeyHeader:
      name: x-api-key
      in: header
      required: false
      schema:
        type: string
      description: |
        Your API key from the developer portal (Header method - Recommended).
        
        **Alternative**: You can also pass the API key as a query parameter `?key=your_api_key`
      example: ffc_1234567890_abcdefghijk
    
    ApiKeyQuery:
      name: key
      in: query
      required: false
      schema:
        type: string
      description: |
        Your API key from the developer portal (Query parameter method).
        
        **Recommended**: Use the header method (`x-api-key`) for better security.
      example: ffc_1234567890_abcdefghijk

  headers:
    X-RateLimit-Limit:
      description: The maximum number of requests allowed in the current time window
      schema:
        type: integer
      example: 60
    
    X-RateLimit-Remaining:
      description: The number of requests remaining in the current time window
      schema:
        type: integer
      example: 45
    
    X-RateLimit-Reset:
      description: The time when the rate limit resets (Unix timestamp)
      schema:
        type: integer
      example: 1735689600

    X-Quota-Cost:
      description: Monthly quota units consumed by this request (1 for most endpoints, 2 for /stats)
      schema:
        type: integer
      example: 1

    X-Cache:
      description: Whether the response was served from the server-side cache
      schema:
        type: string
        enum: [HIT, MISS]
      example: MISS

  schemas:
    PlayerInfoResponse:
      type: object
      description: Comprehensive player information
      required:
        - basicInfo
      properties:
        basicInfo:
          $ref: '#/components/schemas/PlayerBasicInfo'
        captainBasicInfo:
          $ref: '#/components/schemas/PlayerBasicInfo'
        clanBasicInfo:
          $ref: '#/components/schemas/ClanBasicInfo'
        petInfo:
          $ref: '#/components/schemas/PetInfo'
        creditScoreInfo:
          $ref: '#/components/schemas/CreditScoreInfo'
        diamondCostRes:
          $ref: '#/components/schemas/DiamondCostResponse'
        profileInfo:
          $ref: '#/components/schemas/ProfileInfo'
        socialInfo:
          $ref: '#/components/schemas/SocialInfo'
      additionalProperties: true

    PlayerBasicInfo:
      type: object
      description: Core account and ranking information
      properties:
        accountId:
          type: string
        nickname:
          type: string
        level:
          type: integer
        rank:
          type: integer
        maxRank:
          type: integer
        csRank:
          type: integer
        csMaxRank:
          type: integer
        rankingPoints:
          type: integer
        region:
          type: string
        seasonId:
          type: integer
        liked:
          type: integer
        title:
          type: string
        badgeId:
          type: string
        bannerId:
          type: string
      additionalProperties: true

    ClanBasicInfo:
      type: object
      properties:
        clanId:
          type: string
        clanName:
          type: string
        captainId:
          type: string
        clanLevel:
          type: integer
        memberNum:
          type: integer
        capacity:
          type: integer
      additionalProperties: true

    PetInfo:
      type: object
      properties:
        id:
          type: string
        skinId:
          type: string
        selectedSkillId:
          type: string
        level:
          type: integer
        exp:
          type: integer
        isSelected:
          type: boolean
      additionalProperties: true

    CreditScoreInfo:
      type: object
      properties:
        creditScore:
          type: integer
        rewardStartAt:
          type: string
        rewardEndAt:
          type: string
        rewardState:
          type: integer
        rewardType:
          type: integer
      additionalProperties: true

    DiamondCostResponse:
      type: object
      properties:
        diamondCost:
          type: integer

    ProfileInfo:
      type: object
      properties:
        avatarId:
          type: string
        clothes:
          type: array
          items:
            type: string
        equipedSkills:
          type: array
          items:
            type: object
            additionalProperties: true
        isSelected:
          type: boolean
        isSelectedAwaken:
          type: boolean
      additionalProperties: true

    SocialInfo:
      type: object
      properties:
        accountId:
          type: string
        signature:
          type: string
      additionalProperties: true

    PlayerStatsResponse:
      type: object
      description: Detailed gameplay statistics
      properties:
        brCareer_solo:
          type: object
        brCareer_duo:
          type: object
        brCareer_squad:
          type: object

    CraftlandMapResponse:
      type: object
      description: Craftland custom map information
      properties:
        map_info:
          type: object

    WishlistResponse:
      type: object
      description: Player's wishlist items
      properties:
        wishlist_items:
          type: array
          items:
            type: object

    BanCheckResponse:
      type: object
      description: Player ban status
      properties:
        status:
          type: string
        data:
          type: object
          properties:
            is_banned:
              type: integer
              enum: [0, 1]
            period:
              type: integer

    ErrorResponse:
      type: object
      description: Standard error response
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
        message:
          type: string
        code:
          type: string
          description: |
            Error code. One of: `AUTH_001` (missing key), `AUTH_002` (invalid key),
            `AUTH_003` (inactive key), `AUTH_004` (expired key), `RATE_001` (rate limit),
            `QUOTA_001` (monthly quota), `PARAM_001` (missing parameter), `RES_001` (not found),
            `SYS_001` (internal error), `SYS_002` (service unavailable), `SYS_003` (upstream
            timeout), or `FW_001`-`FW_004` (edge firewall).
          example: AUTH_001
        requestId:
          type: string
          description: Request identifier, included on 5xx errors
        retryAfter:
          type: integer
          description: Seconds to wait before retrying, when applicable
        documentation:
          type: string
          format: uri
        timestamp:
          type: string
          format: date-time
      additionalProperties: true

  responses:
    BadRequest:
      description: Bad request - Invalid parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: >-
        Unauthorized - missing key (`AUTH_001`), or invalid key (`AUTH_002`). Keys must start
        with `ffc_` and be at least 30 characters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: >-
        Forbidden. Two causes: (1) an edge firewall block, where the error body `code`
        starts with `FW_` (e.g. `FW_001` missing/short User-Agent, `FW_002` blocked
        User-Agent pattern) — set a valid custom `User-Agent` header; or (2) the API key is
        inactive (`AUTH_003`) or expired (`AUTH_004`). Not caused by the region.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    TooManyRequests:
      description: >-
        Too many requests. The body `code` is `RATE_001` (per-minute, per-hour, or per-IP
        limit; check `window` and `type`), `QUOTA_001` (monthly quota exhausted; see `used`,
        `limit`, `requestCost`, `resetDate`), or `FW_004` (edge firewall limit; honor
        `Retry-After`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    BadGateway:
      description: >-
        The data provider failed or returned a non-JSON response (`SYS_002`). Includes
        `upstreamStatus` when available. Safe to retry; `Retry-After` is 5 seconds on
        connection failures.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    GatewayTimeout:
      description: >-
        The data provider did not respond within 8 seconds (`SYS_003`). Retry after the
        `Retry-After` interval (5 seconds).
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ServiceUnavailable:
      description: Service temporarily unavailable (`SYS_002`), for example the backend could not initialize. Retry after `Retry-After` (30 seconds).
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

security:
  - ApiKeyAuth: []

externalDocs:
  description: Get API Key & Full Documentation
  url: https://developers.freefirecommunity.com/
